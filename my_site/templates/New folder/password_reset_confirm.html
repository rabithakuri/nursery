{% extends 'main_base.html' %}
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

{% load static %}


{% block part %}
<h2 class ="text-center"> New Password</h2>
{% if validlink %}

<div class = "col-md-6 offset-md-3" style='padding-top:50px; text-align:center;'> 
	<form method ="POST">
		
		{% csrf_token %}

	  {% comment %} <div class="form-group">

	    <input type="text" class="form-control" placeholder="Enter Username" name = "username">

	  </div>
	  <div class="form-group">

	    <input type="password" class="form-control"  placeholder="Enter Password" name="password"> 
	  </div>
	 
	  <div style='padding-bottom:10px;'>
	  <button type="submit" class="btn btn-secondary">Save</button>
	  </div> {% endcomment %}
	  {% for field in form %}
	  
	  	<div class="form-group">
			  {{ field.errors }}
			  <label>{{ field.label_tag }}</label>
			  <p>{{field}}</p>
		  </div>
		{%endfor%}
		<div style='padding-bottom:10px;'>
			<button type="submit" class="btn btn-secondary">save</button>
			</div>

	</form>
{% else %}
 
    <p style="color:red">Invalid</p>
    <div class = "col-md-6 offset-md-3" style='padding-top:30px; text-align:center;'> 
        <a href="{% url 'password_reset' %}">
        <input type="submit" value="Forgot Password" class=" btn btn-secondary"></a>
        <p>Click here to change your password</p> 
 
    </div>
</div>
{% endif %}



			



{% endblock %}
